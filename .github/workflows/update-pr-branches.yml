name: Update open PR branches after main push

# After each push to main, bring open non-draft PRs up to date so the merge
# gate evaluates them against the current main. Uses a short-lived GitHub App
# token so the branch update re-triggers PR Checks and the agent reviews.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-pr-branches
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Mint short-lived GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update each open PR's branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PRS=$(gh pr list --repo "$REPO" --state open --base main \
            --json number,isDraft,mergeStateStatus,headRepository,headRepositoryOwner \
            --jq '.[] | select(.isDraft == false and .headRepositoryOwner.login == "'"${GITHUB_REPOSITORY_OWNER}"'" and (.mergeStateStatus == "BEHIND" or .mergeStateStatus == "UNKNOWN")) | .number')
          if [ -z "$PRS" ]; then
            echo "No open non-draft PRs needing update."
            exit 0
          fi
          for PR in $PRS; do
            echo "::group::PR #$PR"
            if gh pr update-branch "$PR" --repo "$REPO" 2>&1; then
              echo "Updated PR #$PR"
            else
              echo "::warning::PR #$PR could not be updated (likely conflicts); skipping"
            fi
            echo "::endgroup::"
          done
