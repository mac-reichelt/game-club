name: Assign coding agent

# Deterministic, human-gated hand-off: a maintainer applies the
# `ready-for-coding-agent` label and this assigns the Copilot coding agent.
# No LLM is involved here on purpose — the label is the approval.

on:
  issues:
    types: [labeled]

permissions: {}

concurrency:
  group: assign-coding-agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  assign:
    if: >-
      github.event.label.name == 'ready-for-coding-agent' &&
      !contains(github.event.issue.labels.*.name, 'no-copilot') &&
      !contains(github.event.issue.labels.*.name, 'blocked') &&
      !contains(github.event.issue.labels.*.name, 'needs-decision') &&
      !contains(github.event.issue.labels.*.name, 'epic')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the label was applied by a maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          perm=$(gh api "repos/${REPO}/collaborators/${SENDER}/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write) echo "Label applied by ${SENDER} (${perm})." ;;
            *) echo "::error::${SENDER} (${perm}) may not hand issues to the coding agent."; exit 1 ;;
          esac

      - name: Assign Copilot coding agent
        env:
          # Fine-grained PAT (Issues: R/W on this repo). GITHUB_TOKEN cannot
          # assign the Copilot bot.
          GH_TOKEN: ${{ secrets.GH_AW_AGENT_TOKEN }}
          ISSUE_NODE_ID: ${{ github.event.issue.node_id }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::GH_AW_AGENT_TOKEN secret is not configured."; exit 1
          fi
          # Same mutation the previous workflow used successfully.
          COPILOT_BOT_ID="BOT_kgDOC9w8XQ"
          OWNER_ID=$(gh api "users/${OWNER}" --jq .node_id)
          gh api graphql \
            -f query='mutation($i:ID!,$a:[ID!]!){replaceActorsForAssignable(input:{assignableId:$i,actorIds:$a}){clientMutationId}}' \
            -f i="${ISSUE_NODE_ID}" \
            -f "a[]=${COPILOT_BOT_ID}" \
            -f "a[]=${OWNER_ID}"
          echo "Assigned Copilot to issue #${ISSUE_NUMBER}"
